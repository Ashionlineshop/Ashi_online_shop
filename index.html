
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashi Online Shop</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #222;
    text-align: center;
}

header, footer {
    background: #111827;
    color: white;
    padding: 22px;
}

h1 {
    margin: 0;
    font-size: 30px;
}

.navbar {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 20px;
}

.navbar a {
    color: white;
    text-decoration: none;
    padding: 10px 15px;
    border-radius: 8px;
}

.navbar a:hover {
    background: #2563eb;
}

main {
    max-width: 1200px;
    margin: auto;
    padding: 25px 16px;
}

#searchInput {
    width: 100%;
    max-width: 450px;
    padding: 12px;
    margin: 15px 0;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 16px;
}

.category-list {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin: 20px 0 30px;
}

.category-button {
    background: white;
    color: #1f2937;
    border: 1px solid #cbd5e1;
    padding: 11px 15px;
    border-radius: 20px;
    cursor: pointer;
}

.category-button:hover,
.category-button.active {
    background: #2563eb;
    color: white;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 24px;
}

.product {
    background: white;
    padding: 20px 18px;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    box-shadow: 0 5px 18px #00000010;
    transition: transform 0.3s;
}

.product:hover {
    transform: translateY(-5px);
}

.product img {
    width: 100%;
    height: 180px;
    object-fit: contain;
}

.product-category {
    color: #64748b;
    font-size: 13px;
}

.price {
    color: green;
    font-size: 22px;
    font-weight: bold;
}

button {
    background: #2563eb;
    color: white;
    padding: 11px 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    margin: 4px;
}

button:hover {
    background: #1d4ed8;
}

.cart-section {
    max-width: 900px;
    margin: 30px auto;
    padding: 25px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 5px 18px #00000010;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 14px;
    margin: 12px 0;
    background: #f5f7fb;
    border-radius: 10px;
    flex-wrap: wrap;
}

.cart-item .remove {
    background: #dc2626;
}

#cartTotal {
    color: #15803d;
}

#checkout input {
    display: block;
    width: 100%;
    max-width: 500px;
    padding: 13px;
    margin: 12px auto;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 16px;
}

.whatsapp-button {
    background: #15803d;
}

.whatsapp-button:hover {
    background: #166534;
}

footer {
    margin-top: 30px;
}

@media (max-width: 600px) {
    h1 {
        font-size: 24px;
    }

    .cart-section {
        margin: 20px 12px;
        padding: 16px;
    }
}
</style>
</head>

<body>

<header id="home">
    <h1>🛍️ Ashi Online Shop</h1>
    <p>Welcome to our shop!</p>

    <nav class="navbar">
        <a href="#home">Home</a>
        <a href="#productsSection">Products</a>
        <a href="#cart">🛒 Cart</a>
        <a href="#checkout">Checkout</a>
    </nav>
</header>

<main id="productsSection">
    <h2>Our Products</h2>

    <input
        type="text"
        id="searchInput"
        placeholder="Search products..."
    >

    <h3>Shop by Category</h3>
    <div class="category-list" id="categoryList"></div>

    <div class="products" id="products"></div>
</main>

<section id="cart" class="cart-section">
    <h2>🛒 My Shopping Cart</h2>

    <div id="cartItems">
        <p>Your cart is empty.</p>
    </div>

    <h3 id="cartTotal">Total: Rs. 0</h3>
</section>

<section id="checkout" class="cart-section">
    <h2>📦 Delivery Details</h2>

    <input
        id="customerName"
        type="text"
        placeholder="Your Full Name"
    >

    <input
        id="customerAddress"
        type="text"
        placeholder="Your Complete Address"
    >

    <input
        id="customerPhone"
        type="tel"
        placeholder="Your Phone Number"
    >

    <button onclick="placeWebsiteOrder()">
        Submit Website Order
    </button>

    <button
        class="whatsapp-button"
        onclick="placeWhatsAppOrder()"
    >
        Order on WhatsApp
    </button>

    <p id="orderMessage"></p>
</section>

<footer>
    <p>Thank you for visiting Ashi Online Shop!</p>
</footer>

<script>
const categories = [
    "Women Clothes",
    "Men Clothes",
    "Handbags",
    "Home Appliances",
    "Cosmetics",
    "Novels",
    "Kitchenware",
    "Fashion Accessories",
    "Jewelry",
    "Kids Toys",
    "Kids Accessories",
    "Home Decor",
    "Islamic Accessories",
    "Electronics"
];

const products = [
    {
        id: 1,
        name: "Smart Watch",
        price: 3000,
        image: "images/watch.jpeg",
        category: "Electronics",
        description: "Stylish smart watch"
    },
    {
        id: 2,
        name: "Headphones",
        price: 1800,
        image: "https://placehold.co/300x200?text=Headphones",
        category: "Electronics",
        description: "Enjoy your favourite music"
    },
    {
        id: 3,
        name: "Women's Dress",
        price: 3200,
        image: "images/women dress.jpeg",
        category: "Women Clothes",
        description: "Elegant everyday dress"
    },
    {
        id: 4,
        name: "Men's Shirt",
        price: 1800,
        image: "https://placehold.co/300x200?text=Mens+Shirt",
        category: "Men Clothes",
        description: "Comfortable casual shirt"
    },
    {
        id: 5,
        name: "Handbag",
        price: 2200,
        image: "https://placehold.co/300x200?text=Handbag",
        category: "Handbags",
        description: "Stylish everyday handbag"
    },
    {
        id: 6,
        name: "Hand Chopper",
        price: 1199,
        image: "images/Home appliance.jpeg",
        category: "Home Appliances",
        description: "Useful kitchen hand chopper"
    },
    {
        id: 7,
        name: "Cosmetics Set",
        price: 600,
        image: "images/cosmetics sets.jpeg",
        category: "Cosmetics",
        description: "Beauty products set"
    },
    {
        id: 8,
        name: "Classic Novel",
        price: 2199,
        image: "images/Novel.jpeg",
        category: "Novels",
        description: "A novel for reading lovers"
    },
    {
        id: 9,
        name: "Kitchen Utensils",
        price: 1200,
        image: "https://placehold.co/300x200?text=Kitchenware",
        category: "Kitchenware",
        description: "Useful kitchen utensils"
    },
    {
        id: 10,
        name: "Fashion Sunglasses",
        price: 900,
        image: "https://placehold.co/300x200?text=Sunglasses",
        category: "Fashion Accessories",
        description: "Trendy fashion accessory"
    },
    {
        id: 11,
        name: "Jewelry Set",
        price: 1300,
        image: "https://placehold.co/300x200?text=Jewelry",
        category: "Jewelry",
        description: "Beautiful jewelry set"
    },
    {
        id: 12,
        name: "Kids Toy",
        price: 1000,
        image: "https://placehold.co/300x200?text=Kids+Toy",
        category: "Kids Toys",
        description: "Fun toy for children"
    },
    {
        id: 13,
        name: "Decorative Vase",
        price: 1600,
        image: "https://placehold.co/300x200?text=Home+Decor",
        category: "Home Decor",
        description: "Decorate your home"
    },
    {
        id: 14,
        name: "Prayer Mat",
        price: 1200,
        image: "https://placehold.co/300x200?text=Prayer+Mat",
        category: "Islamic Accessories",
        description: "Comfortable prayer mat"
    },
    {
        id: 15,
        name: "Kids Accessories",
        price: 850,
        image: "images/kids accessories.jpeg",
        category: "Kids Accessories",
        description: "Cute accessories for kids"
    }
];

let cart = [];
let selectedCategory = "All Products";

function showCategories() {
    const container = document.getElementById("categoryList");
    const allCategories = ["All Products", ...categories];

    container.innerHTML = allCategories.map(category => `
        <button
            class="category-button ${
                selectedCategory === category ? "active" : ""
            }"
            onclick="selectCategory(${JSON.stringify(category)})">
            ${category}
        </button>
    `).join("");
}

function selectCategory(category) {
    selectedCategory = category;
    showCategories();
    showProducts(document.getElementById("searchInput").value);
}

function showProducts(searchText = "") {
    const container = document.getElementById("products");

    const filteredProducts = products.filter(product => {
        const text = (
            product.name + " " +
            product.category + " " +
            product.description
        ).toLowerCase();

        const matchesSearch =
            text.includes(searchText.toLowerCase());

        const matchesCategory =
            selectedCategory === "All Products" ||
            product.category === selectedCategory;

        return matchesSearch && matchesCategory;
    });

    if (filteredProducts.length === 0) {
        container.innerHTML =
            "<p>No products found in this category.</p>";
        return;
    }

    container.innerHTML = filteredProducts.map(product => `
        <div class="product">
            <img
                src="${product.image}"
                alt="${product.name}"
                onerror="this.onerror=null;this.src='https://placehold.co/300x200?text=Product+Image';"
            >

            <p class="product-category">${product.category}</p>
            <h3>${product.name}</h3>
            <p>${product.description}</p>

            <p class="price">
                Rs. ${product.price.toLocaleString("en-PK")}
            </p>

            <button onclick="addToCart(${product.id})">
                Add to Cart
            </button>
        </div>
    `).join("");
}

function addToCart(id) {
    const product = products.find(item => item.id === id);
    if (!product) return;

    const existingItem = cart.find(item => item.id === id);

    if (existingItem) {
        existingItem.quantity++;
    } else {
        cart.push({ ...product, quantity: 1 });
    }

    updateCart();
}

function updateCart() {
    const cartItems = document.getElementById("cartItems");
    const cartTotal = document.getElementById("cartTotal");

    if (cart.length === 0) {
        cartItems.innerHTML = "<p>Your cart is empty.</p>";
    } else {
        cartItems.innerHTML = cart.map((item, index) => `
            <div class="cart-item">
                <span>
                    ${item.name} —
                    Rs. ${item.price.toLocaleString("en-PK")}
                </span>

                <div>
                    <button onclick="changeQuantity(${index}, -1)">−</button>
                    <strong>${item.quantity}</strong>
                    <button onclick="changeQuantity(${index}, 1)">+</button>

                    <button
                        class="remove"
                        onclick="removeFromCart(${index})">
                        Remove
                    </button>
                </div>
            </div>
        `).join("");
    }

    const total = cart.reduce(
        (sum, item) => sum + item.price * item.quantity,
        0
    );

    cartTotal.textContent =
        "Total: Rs. " + total.toLocaleString("en-PK");
}

function changeQuantity(index, amount) {
    if (!cart[index]) return;

    cart[index].quantity += amount;

    if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
    }

    updateCart();
}

function removeFromCart(index) {
    cart.splice(index, 1);
    updateCart();
}

function getOrderDetails() {
    const name =
        document.getElementById("customerName").value.trim();

    const address =
        document.getElementById("customerAddress").value.trim();

    const phone =
        document.getElementById("customerPhone").value.trim();

    if (!name || !address || !phone) {
        alert("Please fill in your name, address and phone number.");
        return null;
    }

    if (cart.length === 0) {
        alert("Your cart is empty. Please add a product first.");
        return null;
    }

    const total = cart.reduce(
        (sum, item) => sum + item.price * item.quantity,
        0
    );

    const items = cart.map(item =>
        `${item.name} x ${item.quantity} = Rs. ${
            (item.price * item.quantity).toLocaleString("en-PK")
        }`
    ).join("\n");

    return { name, address, phone, total, items };
}

function placeWebsiteOrder() {
    const order = getOrderDetails();
    if (!order) return;

    document.getElementById("orderMessage").textContent =
        `Demo order prepared for ${order.name}. Total: Rs. ${
            order.total.toLocaleString("en-PK")
        }. This order has not been saved.`;

    alert("Demo only: your order has not been sent or saved.");
}

function placeWhatsAppOrder() {
    const order = getOrderDetails();
    if (!order) return;

    // Replace this with your real shop WhatsApp number.
    // Use country code and digits only, without + or spaces.
    const shopWhatsAppNumber = "923001234567";

    const message =
        `New Order - Ashi Online Shop\n\n` +
        `Name: ${order.name}\n` +
        `Address: ${order.address}\n` +
        `Customer Phone: ${order.phone}\n\n` +
        `Products:\n${order.items}\n\n` +
        `Total: Rs. ${order.total.toLocaleString("en-PK")}`;

    const url =
        "https://wa.me/" + shopWhatsAppNumber +
        "?text=" + encodeURIComponent(message);

    window.open(url, "_blank");
}

document.getElementById("searchInput")
    .addEventListener("input", function () {
        showProducts(this.value);
    });

showCategories();
showProducts();
updateCart();
</script>

</body>
</html>
